name: tidbyt-push
on:
  schedule:
    # ponytail: UTC crons, ~1h DST drift is fine for a glance display
    - cron: "*/15 0-6 * * *" # ~5pm-11pm Pacific: every 15 min
    - cron: "0 7-23 * * *" # rest of day: hourly heartbeat so it never goes stale-green
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pixlet
        run: |
          curl -sL https://github.com/tidbyt/pixlet/releases/download/v0.34.0/pixlet_0.34.0_linux_amd64.tar.gz | tar xz
      - name: Render and push
        run: |
          ./pixlet render hc_status.star api_key="$HC_API_KEY"
          ./pixlet push --api-token "$TIDBYT_TOKEN" --installation-id hcstatus "$TIDBYT_DEVICE_ID" hc_status.webp
        env:
          HC_API_KEY: ${{ secrets.HC_API_KEY }}
          TIDBYT_TOKEN: ${{ secrets.TIDBYT_TOKEN }}
          TIDBYT_DEVICE_ID: ${{ secrets.TIDBYT_DEVICE_ID }}
